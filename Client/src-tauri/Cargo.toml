[package]
name = "armstrong-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "armstrong_core"

[[bin]]
name = "armstrong-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
ui-smoke = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]
packaged-auth = ["desktop"]

[dependencies]
rusqlite = { version = "=0.31.0", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.0", features = ["v4"] }
chrono = { version = "=0.4.45", features = ["serde"] }
tauri = { version = "=2.11.5", optional = true }

sha2 = "=0.10.9"
url = "=2.5.8"
base64 = "=0.22.1"
getrandom = "=0.4.3"

[build-dependencies]
tauri-build = { version = "=2.6.3", optional = true }

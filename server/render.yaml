# Selected Render setup: creation starts an initial deployment even with
# autoDeployTrigger off. Configure account/source access and SQL/CA prerequisites.
# Select this file as the Blueprint path from the repository root.
# The Free instance is for testing. Daily operation needs an appropriate paid
# compute plan: free cold starts can exceed native enrollment/request deadlines.
# Provision the restricted SQL login and database CA secret file before creation.
# See docs/RENDER_SETUP.md; the local migration-owner URL cannot run production.
services:
  - type: web
    name: armstrong-member-api
    runtime: node
    rootDir: server
    region: singapore
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev --ignore-scripts --no-audit --no-fund && npm run build:verify
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Enable true only after provisioning onboarding migration version 2.
      - key: AUTOMATIC_DEVICE_ENROLLMENT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
# Render supplies RENDER=true and RENDER_EXTERNAL_URL for the initial startup.
# Add PUBLIC_API_ORIGIN explicitly only when selecting a custom API domain.
# Secret Files: the current database URL expects /etc/secrets/hi3.crt.

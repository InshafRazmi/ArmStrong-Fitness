name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Client/**'
      - 'server/**'
      - '.github/workflows/windows-installer.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 installer and core checks
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Client
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Validate the packaged public settings
        run: npm run desktop:windows:check
      - name: Select Rust and the Windows MSVC target
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.98.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native business and authorization checks on Windows
        env:
          ARMSTRONG_BUSINESS_FIXTURE_PATH: ${{ runner.temp }}/armstrong-business-fixture.json
          ARMSTRONG_STAFF_FIXTURE_PATH: ${{ runner.temp }}/armstrong-staff-fixture.json
          ARMSTRONG_ATTENDANCE_FIXTURE_PATH: ${{ runner.temp }}/armstrong-attendance-fixture.json
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Verify Windows system HTTPS against public Auth and gym health
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib native_https::tests::real_system_https_client_reaches_public_auth_and_gym_health_without_credentials -- --ignored
      - name: Verify server and native business protocol compatibility
        working-directory: server
        env:
          ARMSTRONG_BUSINESS_FIXTURE_PATH: ${{ runner.temp }}/armstrong-business-fixture.json
          ARMSTRONG_STAFF_FIXTURE_PATH: ${{ runner.temp }}/armstrong-staff-fixture.json
          ARMSTRONG_ATTENDANCE_FIXTURE_PATH: ${{ runner.temp }}/armstrong-attendance-fixture.json
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:native-contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:staff-contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:attendance-contract
      - name: Verify the bundled login settings on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --features packaged-auth desktop_auth::tests
      - name: Run interface checks
        run: npm run test:ui
      - name: Install the pinned Tauri builder
        run: cargo install tauri-cli --version 2.12.1 --locked
      - name: Build the Windows installer with embedded public settings
        run: npm run desktop:windows:build
      - name: Publish signed Windows installer and updater feed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Client
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: ArmStrong Fitness ${{ github.ref_name }}
          releaseBody: Signed Windows installer and automatic update package.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.windows-updater.conf.json --target x86_64-pc-windows-msvc --features desktop,custom-protocol,packaged-auth,windows-updater --bundles nsis --ci
      - name: Upload the installer for desktop acceptance
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ArmStrong-Fitness-Windows-x64
          path: Client/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
